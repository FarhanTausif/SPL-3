[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dehalu-backend"
version = "0.1.0"
description = "Backend verification gateway for DeHalu."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "crewai>=1.14.1",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "psycopg[binary]>=3.2",
    "SQLAlchemy>=2.0",
    "structlog>=24.1",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
test = [
    "pytest>=8.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dehalu"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "unit: Unit tests for individual components",
    "integration: Integration tests for component interactions",
    "live_providers: Tests against real cloud providers",
]
