[project]
name = "dehalu-backend"
version = "0.1.0"
description = "FastAPI backend for DeHalu static hallucination detection prototype"
requires-python = ">=3.11"
dependencies = [
    "tree-sitter==0.25.2",
    "tree-sitter-language-pack==0.9.0",
    "semgrep==1.136.0",
    "setuptools<81",
    "alembic>=1.13.0",
    "fastapi>=0.110.0",
    "httpx>=0.27.0",
    "psycopg[binary]>=3.1.0",
    "pydantic>=2.6.0",
    "sqlalchemy>=2.0.0",
    "uvicorn[standard]>=0.27.0"
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dehalu"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
