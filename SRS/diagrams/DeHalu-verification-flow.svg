<text x="40" y="60" text-anchor="start" fill="#0F172A" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700">DeHalu | Verification &amp; Repair Flow</text>
<text x="40" y="97" text-anchor="start" fill="#0F172A" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700">Actual pipeline order · static analyzers run sequentially · judge-provider calls run in parallel</text>
<rect x="80" y="210" width="280" height="130" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
<text x="220.0" y="242.5" text-anchor="middle" fill="#0F172A" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700">0 · Prompt Intake</text>
<text x="220.0" y="268.5" text-anchor="middle" fill="#334155" font-family="Arial,Helvetica,sans-serif" font-size="14">Normalize language / requirements</text>
<text x="220.0" y="289.5" text-anchor="middle" fill="#334155" font-family="Arial,Helvetica,sans-serif" font-size="14">Record uncertain assumptions</text>
<text x="220.0" y="310.5" text-anchor="middle" fill="#334155" font-family="Arial,Helvetica,sans-serif" font-size="14">Clarify when generation is blocked</text>
<rect x="430" y="210" width="290" height="130" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
<text x="575.0" y="242.5" text-anchor="middle" fill="#0F172A" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700">1 · Local Code Generation</text>
<text x="575.0" y="268.5" text-anchor="middle" fill="#334155" font-family="Arial,Helvetica,sans-serif" font-size="14">Ollama streaming response</text>
<text x="575.0" y="289.5" text-anchor="middle" fill="#334155" font-family="Arial,Helvetica,sans-serif" font-size="14">Separate code + JSON metadata</text>
<text x="575.0" y="310.5" text-anchor="middle" fill="#334155" font-family="Arial,Helvetica,sans-serif" font-size="14">Capture provider metadata</text>
<rect x="790" y="210" width="300" height="130" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
<text x="940.0" y="242.5" text-anchor="middle" fill="#0F172A" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700">2 · Claim Extraction</text>
<text x="940.0" y="268.5" text-anchor="middle" fill="#334155" font-family="Arial,Helvetica,sans-serif" font-size="14">AST imports / APIs / symbols</text>
<text x="940.0" y="289.5" text-anchor="middle" fill="#334155" font-family="Arial,Helvetica,sans-serif" font-size="14">Structured explanation claims</text>
<text x="940.0" y="310.5" text-anchor="middle" fill="#334155" font-family="Arial,Helvetica,sans-serif" font-size="14">Dependencies / assumptions</text>
<rect x="80" y="410" width="280" height="100" rx="10" fill="#FFF7ED" stroke="#F59E0B" stroke-width="1.5"/>
<text x="220.0" y="438.0" text-anchor="middle" fill="#0F172A" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700">Needs Clarification</text>
<text x="220.0" y="464.0" text-anchor="middle" fill="#334155" font-family="Arial,Helvetica,sans-serif" font-size="14">Persist questions → UI</text>
<text x="220.0" y="485.0" text-anchor="middle" fill="#334155" font-family="Arial,Helvetica,sans-serif" font-size="14">User answers → requeue</text>
<rect x="1190" y="200" width="450" height="345" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
<text x="1415.0" y="256.0" text-anchor="middle" fill="#0F172A" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700">3 · Execution-Free Static Detection</text>
<text x="1415.0" y="282.0" text-anchor="middle" fill="#334155" font-family="Arial,Helvetica,sans-serif" font-size="14">Tree-sitter / Python AST</text>
<text x="1415.0" y="303.0" text-anchor="middle" fill="#334155" font-family="Arial,Helvetica,sans-serif" font-size="14">Syntax + incomplete structures</text>
<text x="1415.0" y="324.0" text-anchor="middle" fill="#334155" font-family="Arial,Helvetica,sans-serif" font-size="14"></text>
<text x="1415.0" y="345.0" text-anchor="middle" fill="#334155" font-family="Arial,Helvetica,sans-serif" font-size="14">Semgrep / local SAST rules</text>
<text x="1415.0" y="366.0" text-anchor="middle" fill="#334155" font-family="Arial,Helvetica,sans-serif" font-size="14">Unsafe patterns + resource / quality issues</text>
<text x="1415.0" y="387.0" text-anchor="middle" fill="#334155" font-family="Arial,Helvetica,sans-serif" font-size="14"></text>
<text x="1415.0" y="408.0" text-anchor="middle" fill="#334155" font-family="Arial,Helvetica,sans-serif" font-size="14">Symbol Indexer + Package / API Validator</text>
<text x="1415.0" y="429.0" text-anchor="middle" fill="#334155" font-family="Arial,Helvetica,sans-serif" font-size="14">References + signatures + local catalogs</text>
<text x="1415.0" y="450.0" text-anchor="middle" fill="#334155" font-family="Arial,Helvetica,sans-serif" font-size="14">Optional package-registry evidence</text>
<text x="1415.0" y="471.0" text-anchor="middle" fill="#334155" font-family="Arial,Helvetica,sans-serif" font-size="14"></text>
<text x="1415.0" y="492.0" text-anchor="middle" fill="#334155" font-family="Arial,Helvetica,sans-serif" font-size="14">Collect findings + analyzer coverage</text>
<rect x="1190" y="615" width="450" height="140" rx="10" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
<text x="1415.0" y="652.5" text-anchor="middle" fill="#0F172A" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700">4 · Quantitative Metrics</text>
<text x="1415.0" y="678.5" text-anchor="middle" fill="#334155" font-family="Arial,Helvetica,sans-serif" font-size="14">MiHN / MaHR / TR-S / static severity</text>
<text x="1415.0" y="699.5" text-anchor="middle" fill="#334155" font-family="Arial,Helvetica,sans-serif" font-size="14">Uncertainty + hallucination risk score</text>
<text x="1415.0" y="720.5" text-anchor="middle" fill="#334155" font-family="Arial,Helvetica,sans-serif" font-size="14">Entropy when available; currently unavailable live</text>
<rect x="515" y="660" width="170" height="120" rx="10" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="1.5"/>
<text x="600.0" y="698.0" text-anchor="middle" fill="#0F172A" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700">Gemini</text>
<text x="600.0" y="724.0" text-anchor="middle" fill="#334155" font-family="Arial,Helvetica,sans-serif" font-size="14">Requirement</text>
<text x="600.0" y="745.0" text-anchor="middle" fill="#334155" font-family="Arial,Helvetica,sans-serif" font-size="14">alignment</text>
<rect x="705" y="660" width="170" height="120" rx="10" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="1.5"/>
<text x="790.0" y="698.0" text-anchor="middle" fill="#0F172A" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700">Groq</text>
<text x="790.0" y="724.0" text-anchor="middle" fill="#334155" font-family="Arial,Helvetica,sans-serif" font-size="14">Functional</text>
<text x="790.0" y="745.0" text-anchor="middle" fill="#334155" font-family="Arial,Helvetica,sans-serif" font-size="14">logic</text>
<rect x="895" y="660" width="170" height="120" rx="10" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="1.5"/>
<text x="980.0" y="698.0" text-anchor="middle" fill="#0F172A" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700">Mistral</text>
<text x="980.0" y="724.0" text-anchor="middle" fill="#334155" font-family="Arial,Helvetica,sans-serif" font-size="14">Quality / safety</text>
<text x="980.0" y="745.0" text-anchor="middle" fill="#334155" font-family="Arial,Helvetica,sans-serif" font-size="14">review</text>
<rect x="80" y="650" width="280" height="145" rx="10" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="1.5"/>
<text x="220.0" y="690.0" text-anchor="middle" fill="#0F172A" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700">6 · Judge Consensus</text>
<text x="220.0" y="716.0" text-anchor="middle" fill="#334155" font-family="Arial,Helvetica,sans-serif" font-size="14">Aggregate valid verdicts + scores</text>
<text x="220.0" y="737.0" text-anchor="middle" fill="#334155" font-family="Arial,Helvetica,sans-serif" font-size="14">Agreement / missing judges</text>
<text x="220.0" y="758.0" text-anchor="middle" fill="#334155" font-family="Arial,Helvetica,sans-serif" font-size="14">Majority fail; all 3 pass for pass</text>
<rect x="80" y="905" width="280" height="155" rx="10" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
<text x="220.0" y="939.5" text-anchor="middle" fill="#0F172A" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700">CoVe · Before Policy</text>
<text x="220.0" y="965.5" text-anchor="middle" fill="#334155" font-family="Arial,Helvetica,sans-serif" font-size="14">Question each extracted claim</text>
<text x="220.0" y="986.5" text-anchor="middle" fill="#334155" font-family="Arial,Helvetica,sans-serif" font-size="14">Static + semantic evidence checks</text>
<text x="220.0" y="1007.5" text-anchor="middle" fill="#334155" font-family="Arial,Helvetica,sans-serif" font-size="14">Supported / unsupported / uncertain</text>
<text x="220.0" y="1028.5" text-anchor="middle" fill="#334155" font-family="Arial,Helvetica,sans-serif" font-size="14">Recompute metrics after CoVe</text>
<rect x="430" y="890" width="280" height="180" rx="10" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
<text x="570.0" y="937.0" text-anchor="middle" fill="#0F172A" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700">7 · Policy Gateway</text>
<text x="570.0" y="963.0" text-anchor="middle" fill="#334155" font-family="Arial,Helvetica,sans-serif" font-size="14">Static findings + analyzer coverage</text>
<text x="570.0" y="984.0" text-anchor="middle" fill="#334155" font-family="Arial,Helvetica,sans-serif" font-size="14">Metrics + consensus + CoVe</text>
<text x="570.0" y="1005.0" text-anchor="middle" fill="#334155" font-family="Arial,Helvetica,sans-serif" font-size="14"></text>
<text x="570.0" y="1026.0" text-anchor="middle" fill="#334155" font-family="Arial,Helvetica,sans-serif" font-size="14">ACCEPT / WARN / REPAIR / REJECT</text>
<rect x="805" y="940" width="285" height="130" rx="10" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
<text x="947.5" y="972.5" text-anchor="middle" fill="#0F172A" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700">Final Result + Evidence</text>
<text x="947.5" y="998.5" text-anchor="middle" fill="#334155" font-family="Arial,Helvetica,sans-serif" font-size="14">ACCEPT / WARN: completed</text>
<text x="947.5" y="1019.5" text-anchor="middle" fill="#334155" font-family="Arial,Helvetica,sans-serif" font-size="14">REJECT: rejected</text>
<text x="947.5" y="1040.5" text-anchor="middle" fill="#334155" font-family="Arial,Helvetica,sans-serif" font-size="14">Persist attempts → API → UI</text>
<rect x="1190" y="890" width="450" height="180" rx="10" fill="#FFF7ED" stroke="#F59E0B" stroke-width="1.5"/>
<text x="1415.0" y="937.0" text-anchor="middle" fill="#0F172A" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700">8 · Mitigation + Retry Control</text>
<text x="1415.0" y="963.0" text-anchor="middle" fill="#334155" font-family="Arial,Helvetica,sans-serif" font-size="14">Build repair prompt from failure evidence</text>
<text x="1415.0" y="984.0" text-anchor="middle" fill="#334155" font-family="Arial,Helvetica,sans-serif" font-size="14">Ollama produces repaired code + metadata</text>
<text x="1415.0" y="1005.0" text-anchor="middle" fill="#334155" font-family="Arial,Helvetica,sans-serif" font-size="14">Bound retries / stop repeated code hashes</text>
<text x="1415.0" y="1026.0" text-anchor="middle" fill="#334155" font-family="Arial,Helvetica,sans-serif" font-size="14">Re-run claims → static checks → policy</text>
<text x="40" y="1197" text-anchor="start" fill="#0F172A" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700">Evidence is retained for every attempt; repaired code receives the same verification checks as the initial output.</text>
<text x="40" y="1223" text-anchor="start" fill="#334155" font-family="Arial,Helvetica,sans-serif" font-size="13">CoVe supports every decision. Semantic evidence and partial catalogs do not establish guaranteed runtime correctness.</text>
<rect x="190.9" y="366" width="58.199999999999996" height="18" rx="3" fill="white"/>
<text x="220" y="379" text-anchor="middle" fill="#334155" font-family="Arial,Helvetica,sans-serif" font-size="13">Blocked</text>
<rect x="709.1" y="1089" width="97.8" height="36" rx="3" fill="white"/>
<text x="758" y="1102" text-anchor="middle" fill="#334155" font-family="Arial,Helvetica,sans-serif" font-size="13">Accept / Warn</text>
<text x="758" y="1120" text-anchor="middle" fill="#334155" font-family="Arial,Helvetica,sans-serif" font-size="13">or Reject</text>
<rect x="1128.1" y="841" width="163.79999999999998" height="18" rx="3" fill="white"/>
<text x="1210" y="854" text-anchor="middle" fill="#334155" font-family="Arial,Helvetica,sans-serif" font-size="13">Repair; attempts remain</text>
<rect x="1245.2" y="156" width="249.6" height="18" rx="3" fill="white"/>
<text x="1370" y="169" text-anchor="middle" fill="#334155" font-family="Arial,Helvetica,sans-serif" font-size="13">Repaired artifact → claim extraction</text>
</svg>